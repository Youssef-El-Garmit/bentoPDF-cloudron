server {
    listen 8080;
    server_name _;
    root /app/code;
    index index.html;

    gzip_static off;
    brotli_static off;

    # Force service worker to always revalidate
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
        try_files $uri =404;
    }

    # Serve .mjs files with correct MIME type
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
